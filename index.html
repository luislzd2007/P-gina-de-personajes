<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicas de anime de romance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero is-primary is-small">
    <div class="hero-body has-text-centered">
      <h1 class="title is-2">Purificación de alma</h1>
      <p class="subtitle">Coleción de chicas de animes de romance</p>
    </div>
  </header>

  <main class="section">
    <div class="container">


      <section id="vista-grid">
        <div class="field is-grouped is-grouped-multiline">
          <div class="control is-expanded">
            <input id="buscador" class="input" type="search" placeholder="Buscar por nombre o rol" aria-label="Buscar">
          </div>
          <div class="control">
            <button id="btn-agregar" class="button is-primary">Agregar personaje</button>
          </div>
        </div>
        <p id="contador" class="help" aria-live="polite"></p>
        <div id="grid" class="columns is-multiline is-mobile mt-2"></div>
        <div id="mensaje" class="notification is-light has-text-centered mt-4" hidden></div>
      </section>


      <section id="vista-detalle" hidden></section>


      <section id="vista-form" hidden>
        <div class="columns is-centered">
          <div class="column is-half-desktop">
            <form id="form" class="box" novalidate>
              <h2 id="form-titulo" class="title is-4">Nuevo personaje</h2>

              <div class="field">
                <label class="label" for="f-nombre">Nombre *</label>
                <div class="control"><input id="f-nombre" class="input" type="text"></div>
                <p class="help is-danger error" id="e-nombre"></p>
              </div>

              <div class="field">
                <label class="label" for="f-rol">Rol *</label>
                <div class="control"><input id="f-rol" class="input" type="text" placeholder="Tsundere, Kuudere, Genki..."></div>
                <p class="help is-danger error" id="e-rol"></p>
              </div>

              <div class="field">
                <label class="label" for="f-origen">Origen</label>
                <div class="control"><input id="f-origen" class="input" type="text" placeholder="Anime o historia"></div>
              </div>

              <div class="field">
                <label class="label" for="f-imagen">Imagen (enlace o ruta img/...)</label>
                <div class="control"><input id="f-imagen" class="input" type="text" placeholder="https://... o img/foto.jpg"></div>
                <p class="help is-danger error" id="e-imagen"></p>
              </div>

              <div class="field">
                <label class="label" for="f-descripcion">Descripción</label>
                <div class="control"><textarea id="f-descripcion" class="textarea" rows="3"></textarea></div>
              </div>

              <div class="buttons mt-4">
                <button type="submit" class="button is-primary">Guardar cambios</button>
                <button type="button" id="btn-cancelar" class="button is-light">Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="aviso" class="notification is-dark aviso" role="status" hidden></div>
  <footer class="footer has-text-centered">Datos guardados solo en tu navegador (localStorage)</footer>

  <script src="app.js"></script>
</body>
</html>
